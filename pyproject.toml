[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "equinet"
dynamic = ["version"]
description = "Molecular Property Prediction with Message Passing Neural Networks for Phase Equilibria"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.txt" }
authors = [
    { name = "The EquiNet Development Team (see LICENSE.txt)", email = "mcgillc2@vcu.edu" },
]
keywords = [
    "chemistry",
    "machine learning",
    "property prediction",
    "message passing neural network",
    "graph neural network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "hyperopt>=0.2.3",
    "matplotlib>=3.1.3",
    "numpy>=1.18.1",
    "pandas>=1.0.3",
    "pip>=20.0.2",
    "scikit-learn>=1.4",
    "scipy>=1.4.1",
    "setuptools<82",
    "tensorboardX>=2.0",
    "torch>=2.6",
    "tqdm>=4.45.0",
    "typed-argument-parser>=1.6.1",
    "rdkit>=2020.03.1.0",
    "ipykernel",
    "huggingface_hub",
]

[project.optional-dependencies]
test = [
    "pytest>=6.2.2",
    "parameterized>=0.8.1",
]
dev = [
    "build",
    "twine",
]

[project.scripts]
equinet-train = "equinet.train.cross_validate:equinet_train"
equinet-predict = "equinet.train.make_predictions:equinet_predict"
equinet-parameters = "equinet.train.parameters:equinet_parameters"
equinet-hyperopt = "equinet.hyperparameter_optimization:equinet_hyperopt"

[project.urls]
Homepage = "https://github.com/mcgillresearchgroup/EquiNet"
Source = "https://github.com/mcgillresearchgroup/EquiNet"
Download = "https://github.com/mcgillresearchgroup/EquiNet.git"

[tool.setuptools.packages.find]
include = ["equinet*"]

[tool.setuptools.package-data]
equinet = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "equinet._version.__version__" }